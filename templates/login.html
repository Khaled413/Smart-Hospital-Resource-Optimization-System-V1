<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MediOptim Pro Hospital Management</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #e0f2fe 100%);
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0f172a;
    }
    .login-container {
      width: 100%;
      max-width: 460px;
      padding: 24px;
    }
    .login-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .demo-role-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #334155;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .demo-role-btn:hover {
      background: #eff6ff;
      border-color: #0284c7;
      color: #0369a1;
      transform: translateY(-1px);
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.12);
    }
    .form-control {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }
    .form-control:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:24px">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="MediOptim Pro Logo" style="width:80px;height:80px;object-fit:contain;margin-bottom:12px;filter:drop-shadow(0 4px 8px rgba(2,132,199,0.15));">
      <h2 style="margin:0;font-size:24px;font-weight:800;color:#0f172a;letter-spacing:-0.5px">MediOptim Pro</h2>
      <div style="font-size:13px;color:#64748b;margin-top:4px;font-weight:500">Smart Hospital Resource Optimization System</div>
    </div>

    {% if config.DEMO_MODE %}
    <!-- Public Read-Only Demo Access (Available only when DEMO_MODE=true) -->
    <div style="margin-bottom:20px;background:#f0fdf4;padding:12px;border-radius:10px;border:1px dashed #86efac;text-align:center">
      <div style="font-size:11px;font-weight:700;color:#166534;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">🌿 Demonstration Mode Active</div>
      <button type="button" class="btn btn-sm" onclick="fillDemo()" style="font-size:12px;width:100%;justify-content:center;background:#15803d;color:#fff;border:none">
        👁️ Autofill Read-Only Demo Guest
      </button>
      <div style="font-size:10px;color:#15803d;margin-top:6px">Accesses synthetic hospital data with read-only permissions. Write & admin actions disabled.</div>
    </div>
    {% endif %}

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input class="form-control" id="login-username" placeholder="e.g. admin" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-field-wrap">
          <input class="form-control" type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" data-target="login-password" title="Show password" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full" style="justify-content:center;margin-top:20px" id="login-btn">
        Sign In
      </button>
    </form>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
function fillDemo() {
  document.getElementById('login-username').value = 'demo_viewer';
  document.getElementById('login-password').value = 'DemoViewer#2025!';
}

async function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('login-username').value;
  const p = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Authenticating...';

  try {
    const res = await API.post('/api/auth/login', { username: u, password: p });
    if (res.user && res.user.must_change_password) {
      ToastManager.show('Initial login detected. Please set a new password.', 'warning');
      setTimeout(() => {
        window.location.href = '/change-password';
      }, 700);
      return;
    }
    ToastManager.show(`Welcome back, ${res.user.full_name}!`, 'success');
    setTimeout(() => {
      const params = new URLSearchParams(window.location.search);
      const nextUrl = params.get('next') || '/';
      window.location.href = nextUrl;
    }, 600);
  } catch(err) {
    ToastManager.show(err.message || 'Invalid credentials or account locked', 'error');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
