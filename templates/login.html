<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MediOptim Pro Hospital Management</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #e0f2fe 100%);
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0f172a;
    }
    .login-container {
      width: 100%;
      max-width: 460px;
      padding: 24px;
    }
    .login-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .demo-role-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #334155;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .demo-role-btn:hover {
      background: #eff6ff;
      border-color: #0284c7;
      color: #0369a1;
      transform: translateY(-1px);
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.12);
    }
    .form-control {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }
    .form-control:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:24px">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="MediOptim Pro Logo" style="width:80px;height:80px;object-fit:contain;margin-bottom:12px;filter:drop-shadow(0 4px 8px rgba(2,132,199,0.15));">
      <h2 style="margin:0;font-size:24px;font-weight:800;color:#0f172a;letter-spacing:-0.5px">MediOptim Pro</h2>
      <div style="font-size:13px;color:#64748b;margin-top:4px;font-weight:500">Smart Hospital Resource Optimization System</div>
    </div>

    <!-- Quick Demo Logins -->
    <div style="margin-bottom:24px;background:#f8fafc;padding:14px;border-radius:12px;border:1px dashed #cbd5e1">
      <div style="font-size:11px;font-weight:700;color:#475569;margin-bottom:10px;text-align:center;text-transform:uppercase;letter-spacing:0.5px">⚡ Quick Select Role:</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button type="button" class="demo-role-btn" onclick="fillCreds('admin', 'Admin#2025!')">👑 Admin</button>
        <button type="button" class="demo-role-btn" onclick="fillCreds('dr_sarah', 'Doctor#2025!')">👨‍⚕️ Dr. Sarah</button>
        <button type="button" class="demo-role-btn" onclick="fillCreds('manager', 'Manager#2025!')">🏢 Operations</button>
        <button type="button" class="demo-role-btn" onclick="fillCreds('receptionist', 'Reception#2025!')">📋 Reception</button>
      </div>
      <div style="font-size:10.5px;color:#64748b;margin-top:8px;text-align:center">Click any role to autofill login credentials instantly.</div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input class="form-control" id="login-username" placeholder="e.g. admin" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full" style="justify-content:center;margin-top:20px" id="login-btn">
        Sign In
      </button>
    </form>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
function fillUser(u) {
  document.getElementById('login-username').value = u;
  document.getElementById('login-password').focus();
}
function fillCreds(u, p) {
  document.getElementById('login-username').value = u;
  document.getElementById('login-password').value = p;
}

async function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('login-username').value;
  const p = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Authenticating...';

  try {
    const res = await API.post('/api/auth/login', { username: u, password: p });
    if (res.user && res.user.must_change_password) {
      ToastManager.show(`Welcome! Please update your default password.`, 'warning');
    } else {
      ToastManager.show(`Welcome back, ${res.user.full_name}!`, 'success');
    }
    setTimeout(() => {
      const params = new URLSearchParams(window.location.search);
      const nextUrl = params.get('next') || '/';
      window.location.href = nextUrl;
    }, 600);
  } catch(err) {
    ToastManager.show(err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
