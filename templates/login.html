<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MediOptim Pro Hospital Management</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2.3.0">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #e0f2fe 100%);
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0f172a;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .login-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.05);
      position: relative;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .password-field-wrap {
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      width: 100% !important;
    }
    .password-field-wrap .form-control {
      width: 100% !important;
      padding-right: 44px !important;
      box-sizing: border-box !important;
    }
    body.rtl .password-field-wrap .form-control,
    [dir="rtl"] .password-field-wrap .form-control {
      padding-right: 14px !important;
      padding-left: 44px !important;
    }
    .password-toggle-btn {
      position: absolute !important;
      right: 8px !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      background: transparent !important;
      border: none !important;
      color: #64748b !important;
      cursor: pointer !important;
      padding: 6px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      z-index: 5 !important;
      line-height: 1 !important;
      border-radius: 6px !important;
    }
    .password-toggle-btn:hover {
      color: #0284c7 !important;
      background: #f1f5f9 !important;
    }
    body.rtl .password-toggle-btn,
    [dir="rtl"] .password-toggle-btn {
      right: auto !important;
      left: 8px !important;
    }
    .password-toggle-btn svg {
      width: 18px !important;
      height: 18px !important;
      stroke: currentColor;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <!-- Language Switcher Bar -->
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
      <button type="button" class="btn btn-sm btn-outline" onclick="toggleLanguage()" style="font-size:11.5px;padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e2e8f0;cursor:pointer;color:#475569;">
        🌐 <span id="lang-label">عربي</span>
      </button>
    </div>

    <div style="text-align:center;margin-bottom:26px">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="MediOptim Pro Logo" style="width:80px;height:80px;object-fit:contain;margin-bottom:12px;filter:drop-shadow(0 4px 8px rgba(2,132,199,0.15));">
      <h2 style="margin:0;font-size:24px;font-weight:800;color:#0f172a;letter-spacing:-0.5px">MediOptim Pro</h2>
      <div style="font-size:13px;color:#64748b;margin-top:4px;font-weight:500">Smart Hospital Resource Optimization System</div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input class="form-control" id="login-username" placeholder="e.g. admin" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-field-wrap" style="position:relative !important;display:flex !important;align-items:center !important;width:100% !important;">
          <input class="form-control" type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" style="width:100% !important;padding-right:42px !important;box-sizing:border-box !important;">
          <button type="button" class="password-toggle-btn" data-target="login-password" onclick="togglePasswordVisibility('login-password', this)" title="Show password" aria-label="Show password" style="position:absolute !important;right:8px !important;top:50% !important;transform:translateY(-50%) !important;background:transparent !important;border:none !important;color:#64748b !important;cursor:pointer !important;padding:6px !important;display:inline-flex !important;align-items:center !important;justify-content:center !important;z-index:5 !important;line-height:1 !important;border-radius:6px !important;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full" style="justify-content:center;margin-top:20px" id="login-btn">
        Sign In
      </button>
    </form>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="{{ url_for('static', filename='js/app.js') }}?v=2.3.0"></script>
<script>
const PasswordToggleIcons = {
  eye: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
  eyeOff: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" x2="22" y1="2" y2="22"></line></svg>`
};

function togglePasswordVisibility(targetId, btn) {
  const input = document.getElementById(targetId);
  if (!input) return;
  const isNowText = input.type === 'password';
  input.type = isNowText ? 'text' : 'password';
  if (btn) {
    btn.innerHTML = isNowText ? PasswordToggleIcons.eyeOff : PasswordToggleIcons.eye;
    const isAr = document.documentElement.getAttribute('dir') === 'rtl';
    const label = isNowText ? (isAr ? 'إخفاء كلمة المرور' : 'Hide password') : (isAr ? 'إظهار كلمة المرور' : 'Show password');
    btn.setAttribute('title', label);
    btn.setAttribute('aria-label', label);
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('login-username').value;
  const p = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Authenticating...';

  try {
    const res = await API.post('/api/auth/login', { username: u, password: p });
    if (res.user && res.user.must_change_password) {
      ToastManager.show('Initial login detected. Please set a new password.', 'warning');
      setTimeout(() => {
        window.location.href = '/change-password';
      }, 700);
      return;
    }
    ToastManager.show(`Welcome back, ${res.user.full_name}!`, 'success');
    setTimeout(() => {
      const params = new URLSearchParams(window.location.search);
      const nextUrl = params.get('next') || '/';
      window.location.href = nextUrl;
    }, 600);
  } catch(err) {
    ToastManager.show(err.message || 'Invalid credentials or account locked', 'error');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
