<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — MediOptim Pro</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #e0f2fe 100%);
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0f172a;
    }
    .change-box {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(2, 132, 199, 0.12), 0 0 1px 1px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="change-box">
  <div style="text-align:center;margin-bottom:24px">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="MediOptim Pro Logo" style="width:72px;height:72px;object-fit:contain;margin-bottom:12px;">
    <h2 style="margin:0;font-size:22px;font-weight:800;color:#0f172a;">Set New Password</h2>
    <div style="font-size:13px;color:#64748b;margin-top:4px;">You must update your initial or expired password to continue.</div>
  </div>

  <form id="change-pwd-form" onsubmit="handleChangePassword(event)">
    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label">Current Password</label>
      <input class="form-control" type="password" id="current-password" placeholder="Current temporary password" required>
    </div>

    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label">New Password</label>
      <input class="form-control" type="password" id="new-password" placeholder="At least 8 characters" minlength="8" required>
    </div>

    <div class="form-group" style="margin-bottom:24px;">
      <label class="form-label">Confirm New Password</label>
      <input class="form-control" type="password" id="confirm-password" placeholder="Re-enter new password" minlength="8" required>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-full" style="justify-content:center;width:100%" id="save-btn">
      Update Password & Continue
    </button>
  </form>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
async function handleChangePassword(e) {
  e.preventDefault();
  const currentPassword = document.getElementById('current-password').value;
  const newPassword = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;

  if (newPassword !== confirmPassword) {
    ToastManager.show('New passwords do not match.', 'error');
    return;
  }
  if (newPassword.length < 8) {
    ToastManager.show('Password must be at least 8 characters.', 'error');
    return;
  }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Updating...';

  try {
    const res = await API.post('/api/auth/change-password', {
      current_password: currentPassword,
      new_password: newPassword
    });
    ToastManager.show('Password updated successfully! Redirecting...', 'success');
    setTimeout(() => {
      window.location.href = '/';
    }, 800);
  } catch (err) {
    ToastManager.show(err.message || 'Failed to update password', 'error');
    btn.disabled = false;
    btn.textContent = 'Update Password & Continue';
  }
}
</script>
</body>
</html>
