<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#0b1736"/>
      <stop offset="100%" stop-color="#081026"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Pulse / Cardiogram Wave -->
  <path d="M 0 280 L 220 280 L 240 260 L 260 300 L 280 230 L 305 340 L 330 250 L 350 290 L 370 280 L 700 280 L 720 250 L 745 320 L 770 240 L 795 310 L 820 280 L 1200 280" 
        fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.25" filter="url(#glow)"/>

  <!-- Left Medical Shield Icon -->
  <g transform="translate(80, 75)">
    <!-- Shield Outline -->
    <path d="M 50 10 C 80 10 95 30 95 65 C 95 110 50 140 50 140 C 50 140 5 110 5 65 C 5 30 20 10 50 10 Z" 
          fill="#0c1a3a" stroke="#0284c7" stroke-width="3" filter="url(#glow)"/>
    <!-- Medical Cross -->
    <rect x="42" y="38" width="16" height="54" rx="4" fill="url(#primaryGrad)"/>
    <rect x="23" y="57" width="54" height="16" rx="4" fill="url(#primaryGrad)"/>
  </g>

  <!-- Main Titles -->
  <g transform="translate(210, 100)">
    <!-- Eyebrow Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.2"/>
    <text x="110" y="18" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ENTERPRISE HEALTHCARE AI</text>
    
    <!-- Main Headline -->
    <text x="0" y="72" font-family="'Segoe UI', Inter, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      MediOptim <tspan fill="url(#primaryGrad)">Pro</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="108" font-family="'Segoe UI', Inter, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Smart Hospital Resource Optimization &amp; Clinical Operations System
    </text>

    <text x="0" y="136" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400" fill="#64748b">
      Linear Programming (PuLP) • Emergency Code Red Preemption • Bed &amp; Device Matrix • ML No-Show Prediction
    </text>
  </g>

  <!-- Feature Pills / Badges along bottom -->
  <g transform="translate(80, 290)">
    <!-- Badge 1: Linear Programming -->
    <g transform="translate(0, 0)">
      <rect width="230" height="56" rx="10" fill="#0f1f3d" stroke="#1e3a6a" stroke-width="1.5"/>
      <text x="20" y="26" font-size="16">🔢</text>
      <text x="48" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">PuLP / CBC Solver</text>
      <text x="48" y="42" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Linear &amp; Hybrid Scheduling</text>
    </g>

    <!-- Badge 2: Code Red -->
    <g transform="translate(250, 0)">
      <rect width="230" height="56" rx="10" fill="#1f1118" stroke="#5a1a24" stroke-width="1.5"/>
      <text x="20" y="26" font-size="16">🚨</text>
      <text x="48" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ef4444">Code Red Preemption</text>
      <text x="48" y="42" font-family="Inter, sans-serif" font-size="11" fill="#fca5a5">Real-time Emergency Slot Bumping</text>
    </g>

    <!-- Badge 3: Inpatient Beds -->
    <g transform="translate(500, 0)">
      <rect width="230" height="56" rx="10" fill="#0c2422" stroke="#134e4a" stroke-width="1.5"/>
      <text x="20" y="26" font-size="16">🛏️</text>
      <text x="48" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#14b8a6">Inpatient Bed Tracking</text>
      <text x="48" y="42" font-family="Inter, sans-serif" font-size="11" fill="#5eead4">Admit, Discharge &amp; Sterilization</text>
    </g>

    <!-- Badge 4: Bilingual RTL -->
    <g transform="translate(750, 0)">
      <rect width="270" height="56" rx="10" fill="#161836" stroke="#312e81" stroke-width="1.5"/>
      <text x="20" y="26" font-size="16">🌐</text>
      <text x="48" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#818cf8">Bilingual &amp; RTL Support</text>
      <text x="48" y="42" font-family="Inter, sans-serif" font-size="11" fill="#c7d2fe">كامل باللغتين العربية والإنجليزية</text>
    </g>
  </g>

  <!-- Right Decorative Pulse Circle -->
  <g transform="translate(1080, 150)" opacity="0.6">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#38bdf8" filter="url(#glow)"/>
  </g>
</svg>
