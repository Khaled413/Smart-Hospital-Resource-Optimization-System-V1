        <text x="110" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Carol White</text>

        <rect x="155" width="60" height="32" rx="6" fill="#0284c7" opacity="0.85"/>
        <text x="185" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Tyler Y.</text>
      </g>
    </g>

    <!-- Doctor 4: Dr. Maria Santos (Surgery) -->
    <g transform="translate(24, 275)">
      <text x="0" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Dr. M. Santos</text>
      <text x="0" y="34" font-family="Inter, sans-serif" font-size="10" fill="#38bdf8">Gen Surgery (S-501)</text>
      <!-- Slots -->
      <g transform="translate(156, 4)">
        <rect width="130" height="32" rx="6" fill="#dc2626" opacity="0.85"/>
        <text x="65" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Emma D. (Appendectomy)</text>

        <rect x="140" width="115" height="32" rx="6" fill="#0284c7" opacity="0.85"/>
        <text x="197" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Olivia Martin (Pre-op)</text>
      </g>
    </g>
  </g>

