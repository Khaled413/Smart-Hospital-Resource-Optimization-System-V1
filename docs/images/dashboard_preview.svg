        <rect x="140" width="85" height="32" rx="6" fill="#0284c7" opacity="0.85"/>
        <text x="182" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Ryan Lewis</text>
      </g>
    </g>

    <!-- Doctor 3: Dr. Linda Park (Orthopedics) -->
    <g transform="translate(24, 215)">
      <text x="0" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Dr. L. Park</text>
      <text x="0" y="34" font-family="Inter, sans-serif" font-size="10" fill="#38bdf8">Orthopedics (O-302)</text>
      <!-- Slots -->
