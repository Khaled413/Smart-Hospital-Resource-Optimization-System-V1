    <text x="20" y="30" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">INPATIENT BED FLEET STATUS</text>
    
    <g transform="translate(20, 50)">
      <!-- Bed 1 -->
      <rect width="90" height="50" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
      <text x="45" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#10b981" text-anchor="middle">BED-C101-A</text>
      <text x="45" y="40" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">🟢 Vacant</text>

      <!-- Bed 2 -->
      <rect x="100" width="90" height="50" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
      <text x="145" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#f87171" text-anchor="middle">BED-N202-01</text>
      <text x="145" y="40" font-family="Inter, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">🔴 Neuro ICU</text>

      <!-- Bed 3 -->
