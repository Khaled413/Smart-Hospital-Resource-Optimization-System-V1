      <circle cx="20" cy="17" r="11" fill="#0284c7"/>
      <text x="20" y="21" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">AD</text>
      <text x="38" y="22" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Chief Administrator</text>
    </g>
  </g>

  <!-- 4 KPI Summary Cards -->
  <g transform="translate(30, 95)">
    <!-- Card 1: Consultations -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="245" height="96" rx="12" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.2"/>
      <text x="20" y="28" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CONSULTATIONS TODAY</text>
      <text x="20" y="65" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#ffffff">27</text>
      <rect x="180" y="22" width="46" height="46" rx="10" fill="#0284c7" opacity="0.2"/>
      <text x="203" y="52" font-size="22" text-anchor="middle">🩺</text>
      <text x="20" y="84" font-family="Inter, sans-serif" font-size="10.5" fill="#38bdf8">100% Scheduled on Time</text>
    </g>

    <!-- Card 2: Bed Occupancy -->
    <g transform="translate(265, 0)" filter="url(#shadow)">
      <rect width="245" height="96" rx="12" fill="url(#cardGrad)" stroke="#134e4a" stroke-width="1.2"/>
      <text x="20" y="28" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">INPATIENT BED OCCUPANCY</text>
      <text x="20" y="65" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#ffffff">66.7%</text>
      <rect x="180" y="22" width="46" height="46" rx="10" fill="#0d9488" opacity="0.2"/>
      <text x="203" y="52" font-size="22" text-anchor="middle">🛏️</text>
      <text x="20" y="84" font-family="Inter, sans-serif" font-size="10.5" fill="#14b8a6">6 Occupied • 2 UV-C Turnaround</text>
    </g>

    <!-- Card 3: Utilization Rate -->
    <g transform="translate(530, 0)" filter="url(#shadow)">
      <rect width="245" height="96" rx="12" fill="url(#cardGrad)" stroke="#78350f" stroke-width="1.2"/>
      <text x="20" y="28" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">OR &amp; CLINIC UTILIZATION</text>
      <text x="20" y="65" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#ffffff">74.2%</text>
      <rect x="180" y="22" width="46" height="46" rx="10" fill="#d97706" opacity="0.2"/>
      <text x="203" y="52" font-size="22" text-anchor="middle">⚡</text>
      <text x="20" y="84" font-family="Inter, sans-serif" font-size="10.5" fill="#f59e0b">+18.5% over manual baseline</text>
