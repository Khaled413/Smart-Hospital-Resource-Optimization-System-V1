<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#0e172e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15213b"/>
      <stop offset="100%" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="1100" height="580" rx="16" fill="url(#dbBg)"/>
  <rect x="1" y="1" width="1098" height="578" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top App Navigation Bar Mockup -->
  <g transform="translate(30, 24)">
    <rect width="1040" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="28" cy="27" r="14" fill="#0284c7"/>
    <text x="28" y="32" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">M</text>
    <text x="54" y="32" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">MediOptim <tspan fill="#38bdf8">Pro</tspan></text>
    
    <!-- Status Badges -->
    <rect x="210" y="15" width="130" height="24" rx="12" fill="#0369a1" opacity="0.3"/>
    <circle cx="224" cy="27" r="4" fill="#38bdf8"/>
    <text x="235" y="31" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">PuLP MIP Active</text>

    <rect x="350" y="15" width="140" height="24" rx="12" fill="#059669" opacity="0.2"/>
    <circle cx="364" cy="27" r="4" fill="#10b981"/>
    <text x="375" y="31" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#10b981">Zero Room Conflicts</text>

    <!-- Right Side User Chip -->
    <g transform="translate(860, 10)">
