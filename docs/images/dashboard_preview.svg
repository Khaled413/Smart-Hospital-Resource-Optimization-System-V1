      <text x="20" y="28" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">EMERGENCY ADMISSIONS</text>
      <text x="20" y="65" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#ffffff">0 min</text>
      <rect x="180" y="22" width="46" height="46" rx="10" fill="#dc2626" opacity="0.2"/>
      <text x="203" y="52" font-size="22" text-anchor="middle">🚨</text>
      <text x="20" y="84" font-family="Inter, sans-serif" font-size="10.5" fill="#fca5a5">Zero Wait Code Red Preemption</text>
    </g>
  </g>

  <!-- Middle Section: Doctor Daily Gantt Timeline Simulation -->
  <g transform="translate(30, 210)" filter="url(#shadow)">
