      <text x="245" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#f59e0b" text-anchor="middle">BED-N202-02</text>
      <text x="245" y="40" font-family="Inter, sans-serif" font-size="9" fill="#fde68a" text-anchor="middle">🧼 UV-C Clean</text>

      <!-- Bed 4 -->
      <rect y="60" width="90" height="50" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="45" y="84" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle">BED-P402-03</text>
      <text x="45" y="100" font-family="Inter, sans-serif" font-size="9" fill="#bae6fd" text-anchor="middle">🔵 Reserved</text>

      <!-- Bed 5 -->
      <rect x="100" y="60" width="90" height="50" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="1.5"/>
      <text x="145" y="84" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#f87171" text-anchor="middle">BED-P402-01</text>
      <text x="145" y="100" font-family="Inter, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">🔴 Ped Obs</text>

      <!-- Bed 6 -->
      <rect x="200" y="60" width="90" height="50" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
      <text x="245" y="84" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#10b981" text-anchor="middle">BED-S501-A</text>
      <text x="245" y="100" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">🟢 Surgery</text>
