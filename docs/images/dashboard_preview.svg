        <rect x="90" width="65" height="32" rx="6" fill="#0284c7" opacity="0.85"/>
        <text x="122" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Frank W.</text>

