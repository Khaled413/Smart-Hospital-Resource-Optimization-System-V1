    <!-- Sub-card 2: ML No-Show Engine -->
    <g transform="translate(0, 195)">
      <rect width="340" height="145" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="20" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#ffffff">ML PATIENT NO-SHOW INFERENCE</text>
      
      <g transform="translate(20, 44)">
        <text x="0" y="14" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Quinn Roberts (Age 19, Routine Check):</text>
        <rect y="22" width="220" height="10" rx="5" fill="#1e293b"/>
        <rect y="22" width="170" height="10" rx="5" fill="#f59e0b"/>
        <text x="235" y="31" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#f59e0b">77% Risk</text>
        
        <text x="0" y="58" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Alice Johnson (Age 45, Critical Triage):</text>
        <rect y="66" width="220" height="10" rx="5" fill="#1e293b"/>
        <rect y="66" width="30" height="10" rx="5" fill="#10b981"/>
        <text x="235" y="75" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#10b981">14% Risk</text>
