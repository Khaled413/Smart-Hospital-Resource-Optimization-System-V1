<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131f37"/>
      <stop offset="100%" stop-color="#0f1a30"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" rx="16" fill="url(#bg)"/>

  <!-- Title Header -->
  <text x="50" y="50" font-family="'Segoe UI', Inter, sans-serif" font-size="22" font-weight="800" fill="#ffffff">SYSTEM ARCHITECTURE</text>
  <text x="50" y="74" font-family="'Segoe UI', Inter, sans-serif" font-size="13" fill="#94a3b8">MediOptim Pro — Multi-Layer Clinical Optimization &amp; Operations Pipeline</text>

  <!-- LAYER 1: Presentation Layer (Top) -->
  <g transform="translate(50, 100)">
    <rect width="900" height="95" rx="10" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">LAYER 1: PRESENTATION &amp; CLINICAL INTERFACES</text>
    
    <g transform="translate(20, 40)">
      <!-- Item 1 -->
      <rect width="160" height="42" rx="6" fill="#0b1329" stroke="#0284c7" stroke-width="1"/>
      <text x="80" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">📊 Operations Dashboard</text>
      <!-- Item 2 -->
      <rect x="175" width="160" height="42" rx="6" fill="#0b1329" stroke="#0284c7" stroke-width="1"/>
      <text x="255" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">📈 Doctor Gantt Timeline</text>
      <!-- Item 3 -->
      <rect x="350" width="160" height="42" rx="6" fill="#0b1329" stroke="#0d9488" stroke-width="1"/>
      <text x="430" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#14b8a6" text-anchor="middle">🛏️ Bed &amp; Ward Matrix</text>
      <!-- Item 4 -->
      <rect x="525" width="160" height="42" rx="6" fill="#0b1329" stroke="#ef4444" stroke-width="1"/>
      <text x="605" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">🚨 Code Red Modal</text>
      <!-- Item 5 -->
      <rect x="700" width="160" height="42" rx="6" fill="#0b1329" stroke="#6366f1" stroke-width="1"/>
      <text x="780" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">📺 Waiting Hall Monitor</text>
    </g>
  </g>

  <!-- Down Arrows -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="200" y1="195" x2="200" y2="225"/>
    <line x1="500" y1="195" x2="500" y2="225"/>
    <line x1="800" y1="195" x2="800" y2="225"/>
  </g>

  <!-- LAYER 2: Application & API Layer -->
  <g transform="translate(50, 225)">
    <rect width="900" height="95" rx="10" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">LAYER 2: FLASK RESTful API, SECURITY &amp; RBAC</text>

    <g transform="translate(20, 40)">
      <rect width="200" height="42" rx="6" fill="#0b1329" stroke="#1e3a5f" stroke-width="1"/>
      <text x="100" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🔐 Role-Based Access Control</text>

      <rect x="220" width="200" height="42" rx="6" fill="#0b1329" stroke="#1e3a5f" stroke-width="1"/>
      <text x="320" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">⚡ Emergency Preemption API</text>

      <rect x="440" width="200" height="42" rx="6" fill="#0b1329" stroke="#1e3a5f" stroke-width="1"/>
      <text x="540" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🛏️ Inpatient Bed State Engine</text>

      <rect x="660" width="200" height="42" rx="6" fill="#0b1329" stroke="#1e3a5f" stroke-width="1"/>
      <text x="760" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">📝 Audit Trail Logger</text>
    </g>
  </g>

  <!-- Down Arrows -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="300" y1="320" x2="300" y2="350"/>
    <line x1="700" y1="320" x2="700" y2="350"/>
  </g>

  <!-- LAYER 3: Operations Research & AI Engines -->
  <g transform="translate(50, 350)">
    <rect width="900" height="110" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="2"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">LAYER 3: CORE OPERATIONS RESEARCH &amp; PREDICTIVE AI</text>

    <g transform="translate(20, 42)">
      <!-- LP Box -->
      <rect width="265" height="52" rx="6" fill="#0b1736" stroke="#0284c7" stroke-width="1.2"/>
      <text x="132" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">🔢 Linear Programming (MIP)</text>
      <text x="132" y="42" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">PuLP / Coin-OR CBC Solver</text>

      <!-- Code Red & Greedy Box -->
      <rect x="290" width="275" height="52" rx="6" fill="#1f1118" stroke="#ef4444" stroke-width="1.2"/>
      <text x="427" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ef4444" text-anchor="middle">🚨 Preemption &amp; Greedy Heuristic</text>
      <text x="427" y="42" font-family="Inter, sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Dynamic Buffer &amp; Procedure Durations</text>

      <!-- ML Risk Box -->
      <rect x="590" width="270" height="52" rx="6" fill="#0c1f2e" stroke="#0d9488" stroke-width="1.2"/>
      <text x="725" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#14b8a6" text-anchor="middle">🤖 ML No-Show &amp; Simulator</text>
      <text x="725" y="42" font-family="Inter, sans-serif" font-size="11" fill="#5eead4" text-anchor="middle">Crisis "What-If" Stress Testing</text>
    </g>
  </g>

  <!-- Down Arrows -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6">
    <line x1="500" y1="460" x2="500" y2="485"/>
  </g>

  <!-- LAYER 4: Persistence Layer (Bottom) -->
  <g transform="translate(50, 485)">
    <rect width="900" height="75" rx="10" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="20" y="25" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">LAYER 4: PERSISTENCE &amp; CLINICAL DATA STORAGE</text>
    
    <g transform="translate(20, 36)">
      <text x="0" y="18" font-family="Inter, sans-serif" font-size="13" fill="#f8fafc">
        🗄️ <tspan font-weight="700">SQLAlchemy ORM</tspan> • SQLite (Local Development) • PostgreSQL (Production Ready) • 8 Relational Tables (Users, Patients, Doctors, Rooms, Beds, Equipment, Appointments, Runs, AuditLogs)
      </text>
    </g>
  </g>
</svg>
